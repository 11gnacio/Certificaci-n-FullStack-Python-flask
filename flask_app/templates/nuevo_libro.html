{% extends "base.html" %}

{% block contenido %}
<div class="col-md-7">
    <h2 class="fw-bold mb-4">Agregar Nuevo Libro</h2>

    {% with messages = get_flashed_messages(category_filter=["libro"]) %}
    {% if messages %}
    <div class="alert alert-danger p-2">
        {% for msg in messages %}<p class="m-0 small">{{ msg }}</p>{% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form action="/libros/crear" method="POST">
        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Título:</label>
            <div class="col-sm-8"><input type="text" name="titulo" class="form-control border-dark" required></div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Autor:</label>
            <div class="col-sm-8"><input type="text" name="autor" class="form-control border-dark" required></div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Género:</label>
            <div class="col-sm-8">
                <select name="genero" class="form-select border-dark" required>
                    <option value="">Selecciona un género</option>
                    <option value="Novela">Novela</option>
                    <option value="Fábula">Fábula</option>
                    <option value="Ciencia Ficción">Ciencia Ficción</option>
                    <option value="Romance">Romance</option>
                    <option value="Desarrollo Personal">Desarrollo Personal</option>
                </select>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Fecha de publicación:</label>
            <div class="col-sm-8"><input type="date" name="fecha_publicacion" class="form-control border-dark" required>
            </div>
        </div>

        <div class="row mb-4">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Descripción:</label>
            <div class="col-sm-8"><textarea name="descripcion" class="form-control border-dark" rows="4"
                    required></textarea></div>
        </div>

        <div class="d-flex align-items-center">
            <button type="submit" class="btn btn-dark px-4 py-2 me-4 fs-5">Guardar</button>
            <a href="/libros" class="text-primary fs-5 text-decoration-none">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
