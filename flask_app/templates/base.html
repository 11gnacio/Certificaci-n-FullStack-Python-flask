<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% if session.get('usuario_id') %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-3" href="/libros">📖 BookHub</a>
            <div class="collapse navbar-collapse ms-4">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item me-3"><a class="nav-link fs-5" href="/libros">Mis Libros</a></li>
                    <li class="nav-item me-3"><a class="nav-link fs-5" href="#">Explorar</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="/favoritos">Mis Favoritos</a></li>
                </ul>
                <!-- Menú desplegable con el nombre de usuario -->
                <div class="dropdown me-4">
                    <a class="btn btn-dark dropdown-toggle fs-5 p-0 border-0" href="#" role="button" id="dropdownMenuLink" data-bs-toggle="dropdown" aria-expanded="false">
                        Bienvenido, {{ usuario.nombre }}
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuLink">
                        <li><a class="dropdown-item text-danger fw-semibold" href="/logout">🚪 Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container-fluid px-4">
        {% block contenido %}{% endblock %}
    </div>

    <!-- Script de Bootstrap necesario para el funcionamiento del menú desplegable -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
