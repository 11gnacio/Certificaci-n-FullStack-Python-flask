{% extends "base.html" %}

{% block contenido %}
<div class="col-md-7">
    <h2 class="fw-bold mb-4">Editar Libro</h2>

    {% with messages = get_flashed_messages(category_filter=["libro"]) %}
    {% if messages %}
    <div class="alert alert-danger p-2">
        {% for msg in messages %}<p class="m-0 small">{{ msg }}</p>{% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form action="/libros/actualizar/{{ libro.id }}" method="POST">
        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Título:</label>
            <div class="col-sm-8"><input type="text" name="titulo" value="{{ libro.titulo }}"
                    class="form-control border-dark" required></div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Autor:</label>
            <div class="col-sm-8"><input type="text" name="autor" value="{{ libro.autor }}"
                    class="form-control border-dark" required></div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Género:</label>
            <div class="col-sm-8">
                <select name="genero" class="form-select border-dark" required>
                    <option value="Novela" {% if libro.genero=='Novela' %}selected{% endif %}>Novela</option>
                    <option value="Fábula" {% if libro.genero=='Fábula' %}selected{% endif %}>Fábula</option>
                    <option value="Ciencia Ficción" {% if libro.genero=='Ciencia Ficción' %}selected{% endif %}>Ciencia
                        Ficción</option>
                    <option value="Romance" {% if libro.genero=='Romance' %}selected{% endif %}>Romance</option>
                    <option value="Desarrollo Personal" {% if libro.genero=='Desarrollo Personal' %}selected{% endif %}>
                        Desarrollo Personal</option>
                </select>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Fecha de publicación:</label>
            <div class="col-sm-8"><input type="date" name="fecha_publicacion" value="{{ libro.fecha_publicacion }}"
                    class="form-control border-dark" required></div>
        </div>

        <div class="row mb-4">
            <label class="col-sm-4 col-form-label fs-5 fw-semibold">Descripción:</label>
            <div class="col-sm-8"><textarea name="descripcion" class="form-control border-dark" rows="4"
                    required>{{ libro.descripcion }}</textarea></div>
        </div>

        <div class="d-flex align-items-center">
            <button type="submit" class="btn btn-dark px-4 py-2 me-4 fs-5">Actualizar</button>
            <a href="/libros" class="text-primary fs-5 text-decoration-none">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
